name: Build Neon Cyberpunk MTZ

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MTZ prototype
        run: python build_mtz.py

      - name: Upload MTZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-cyberpunk-mtz-prototype
          path: |
            dist/NeonCyberpunk.mtz
            dist/home-preview.jpg
            dist/lockscreen-preview.jpg
